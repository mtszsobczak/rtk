[filters.just]
description = "Compact just task runner output — strip recipe headers, keep command output"
match_command = "^just\\b"
# Capture stderr too: recipes run the real tool (tsc/mypy/pytest/…) often via
# docker, and the output classifier needs the full stream to detect the tool.
filter_stderr = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*Available recipes:",
  "^\\s*just --list",
]
truncate_lines_at = 150
# Fallback for recipes with no classify signature: keep the head for context and
# the tail for the verdict. Test runners / builds put pass-fail and error
# summaries at the bottom, so a head-only cap drops exactly what matters.
head_lines = 20
tail_lines = 30

[[tests.just]]
name = "preserves command output"
input = "cargo test\n\ntest result: ok. 42 passed; 0 failed\n"
expected = "cargo test\ntest result: ok. 42 passed; 0 failed"

[[tests.just]]
name = "preserves error output"
input = "error: Compilation failed\nsrc/main.rs:10: expected `;`"
expected = "error: Compilation failed\nsrc/main.rs:10: expected `;`"

[[tests.just]]
name = "empty input"
input = ""
expected = ""
